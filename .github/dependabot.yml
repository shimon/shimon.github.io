version: 2
updates:
  # Ruby gems used to build the site. These run only at build time -- on the
  # Actions runner and locally -- never in a visitor's browser.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "gems"
    groups:
      # One PR per week for routine bumps; security fixes still come separately
      # and immediately.
      build-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Action versions in .github/workflows (checkout, setup-ruby, deploy-pages...)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "actions"
    groups:
      github-actions:
        patterns:
          - "*"
